server:
  port: 8081
spring:
  servlet:
    multipart:
      location: /tmp
      max-file-size: 10MB
      max-request-size: 10MB
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
ghost:
  markdown:
    storage-directory: ${GHOST_MARKDOWN_STORAGE_DIRECTORY:${java.io.tmpdir}/ghost-pdf5/markdown}
  ocr:
    provider: ${GHOST_OCR_PROVIDER:anthropic}
    vision:
      enabled: ${GHOST_OCR_VISION_ENABLED:false}
      model: ${GHOST_OCR_VISION_MODEL:claude-opus-5}
      api-key-env: ${GHOST_OCR_VISION_API_KEY_ENV:ANTHROPIC_API_KEY}
      timeout-seconds: 60
      max-image-file-size: 20559957
      max-image-pixels: 40000000
      max-output-tokens: 8000
    openai:
      enabled: ${GHOST_OCR_OPENAI_ENABLED:false}
      model: ${GHOST_OCR_OPENAI_MODEL:gpt-4o}
      api-key-env: ${GHOST_OCR_OPENAI_API_KEY_ENV:OPENAI_API_KEY}
      timeout-seconds: 60
      max-image-file-size: 20559957
      max-image-pixels: 40000000
      max-output-tokens: 8000
    tesseract:
      enabled: ${GHOST_OCR_TESSERACT_ENABLED:false}
      command: ${GHOST_OCR_TESSERACT_COMMAND:tesseract}
      tessdata-directory: ${GHOST_OCR_TESSDATA_DIRECTORY:}
      languages: ${GHOST_OCR_TESSERACT_LANGUAGES:jpn+eng}
      psm: 6
      preserve-interword-spaces: true
      timeout-seconds: 60
