server:
  port: 8081
  tomcat:
    # 上限超過時に残りのリクエストボディを読み捨ててから413を返すための余裕。
    # 既定2MBでは接続が切られ、ブラウザ側は理由の分からないネットワークエラーになる。
    max-swallow-size: 30MB
spring:
  servlet:
    multipart:
      location: /tmp
      # アプリ側の上限(PdfConstants.MAX_PDF_FILE_SIZE_BYTES = 20MB)より大きくする。
      # アプリ側の検証が先に動き、413をJSONで返せるようにするため。
      max-file-size: 25MB
      # 編集元1件 + 差し込み最大10件が1ファイル20MBでも通る値。
      # リクエスト全体の上限には実質到達させず、上限判定を1ファイル20MBへ一本化する。
      max-request-size: 240MB
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
ghost:
  pdf:
    thumbnail:
      # ページ選択用サムネイルは1リクエストで全ページ分を返すため、解像度とページ数の上限を設定で絞れるようにする。
      # 40dpiはA4で約331x468px。PNG 1ページ20〜40 KB程度、base64化で約1.33倍のため100ページで概ね3〜5 MB。
      dpi: ${GHOST_PDF_THUMBNAIL_DPI:40}
      max-pages: ${GHOST_PDF_THUMBNAIL_MAX_PAGES:100}
    image:
      # ページ画像化（POST /imagesPdf）はサムネイルと違い利用者がダウンロードして使うため、設定を分ける。
      # 描画に必要なメモリは解像度の2乗で増えるので、上限を設定で絞れるようにする。
      default-dpi: ${GHOST_PDF_IMAGE_DEFAULT_DPI:150}
      max-dpi: ${GHOST_PDF_IMAGE_MAX_DPI:600}
      max-pages: ${GHOST_PDF_IMAGE_MAX_PAGES:200}
  markdown:
    # 保存したMarkdownは利用者の成果物なので、OSが自動削除する一時ディレクトリへ置かない。
    # 個人のパスを公開リポジトリへ書かず、どのPCでも動くようホーム配下を既定にする。
    storage-directory: ${GHOST_MARKDOWN_STORAGE_DIRECTORY:${user.home}/ghost-pdf5/markdown}
    pdf:
      # PDF出力に使う日本語フォント。未指定なら同梱のNoto Sans JP（SIL OFL 1.1）を使う。
      # 社内指定フォントなどへ差し替える場合だけTrueTypeファイルのパスを設定する。
      font-path: ${GHOST_MARKDOWN_PDF_FONT_PATH:}
      # 太字用フォント。未指定なら本文フォントで代用する（字形は太くならない）。
      bold-font-path: ${GHOST_MARKDOWN_PDF_BOLD_FONT_PATH:}
  ocr:
    provider: ${GHOST_OCR_PROVIDER:anthropic}
    pdf:
      max-pages: ${GHOST_OCR_PDF_MAX_PAGES:20}
      render-dpi: ${GHOST_OCR_PDF_RENDER_DPI:200}
    anthropic:
      enabled: ${GHOST_OCR_ANTHROPIC_ENABLED:false}
      model: ${GHOST_OCR_ANTHROPIC_MODEL:claude-opus-5}
      api-key-env: ${GHOST_OCR_ANTHROPIC_API_KEY_ENV:ANTHROPIC_API_KEY}
      timeout-seconds: 60
      max-image-file-size: 20559957
      max-image-pixels: 40000000
      max-output-tokens: 8000
    openai:
      enabled: ${GHOST_OCR_OPENAI_ENABLED:false}
      model: ${GHOST_OCR_OPENAI_MODEL:gpt-4o}
      api-key-env: ${GHOST_OCR_OPENAI_API_KEY_ENV:OPENAI_API_KEY}
      timeout-seconds: 60
      max-image-file-size: 20559957
      max-image-pixels: 40000000
      max-output-tokens: 8000
    tesseract:
      enabled: ${GHOST_OCR_TESSERACT_ENABLED:false}
      command: ${GHOST_OCR_TESSERACT_COMMAND:tesseract}
      tessdata-directory: ${GHOST_OCR_TESSDATA_DIRECTORY:}
      languages: ${GHOST_OCR_TESSERACT_LANGUAGES:jpn+eng}
      psm: 6
      preserve-interword-spaces: true
      timeout-seconds: 60
  ai:
    # Markdown本文のAI整形・要約（POST /markdownAiTransform）。既定は無効で、有効化した場合のみ
    # 外部AIへMarkdown本文を送信する。APIキー用の環境変数は画像Markdown下書き（ghost.ocr.*）と共用できる。
    provider: ${GHOST_AI_PROVIDER:anthropic}
    markdown:
      # max-output-tokens(既定16000)から独立に決めない。REFINEは出力が入力とほぼ同じ長さになり得るため、
      # 入力上限を通った本文が出力トークン上限に収まる値にする(実測はdocs/markdown-ai-transform-design.md)。
      max-input-characters: ${GHOST_AI_MARKDOWN_MAX_INPUT_CHARACTERS:24000}
    anthropic:
      enabled: ${GHOST_AI_ANTHROPIC_ENABLED:false}
      model: ${GHOST_AI_ANTHROPIC_MODEL:claude-opus-5}
      api-key-env: ${GHOST_AI_ANTHROPIC_API_KEY_ENV:ANTHROPIC_API_KEY}
      timeout-seconds: 60
      # 整形（REFINE）は要約より出力が長くなり得るため、画像文字起こし（8000）より高めにする。
      max-output-tokens: 16000
    openai:
      enabled: ${GHOST_AI_OPENAI_ENABLED:false}
      model: ${GHOST_AI_OPENAI_MODEL:gpt-4o}
      api-key-env: ${GHOST_AI_OPENAI_API_KEY_ENV:OPENAI_API_KEY}
      timeout-seconds: 60
      max-output-tokens: 16000
